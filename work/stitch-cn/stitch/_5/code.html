<style>
        /* Hide scrollbar for category tabs */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Figma Handoff Semantic Classes */
        .Token\/Color\/Background { @apply bg-background text-on-background; }
        .Token\/Color\/Surface { @apply bg-surface text-on-surface; }
        .Token\/Color\/SurfaceContainer { @apply bg-surface-container text-on-surface; }
        .Token\/Color\/SurfaceContainerHigh { @apply bg-surface-container-high text-on-surface; }
        .Token\/Color\/SurfaceVariant { @apply bg-surface-variant text-on-surface-variant; }
        .Token\/Color\/Primary { @apply text-primary; }
        .Token\/Color\/PrimaryContainer { @apply bg-primary-container text-on-primary-container; }
        .Token\/Color\/SecondaryContainer { @apply bg-secondary-container text-on-secondary-container; }
        
        .Token\/Text\/TitleLg { @apply font-headline-lg text-headline-lg; }
        .Token\/Text\/TitleMd { @apply font-headline-md text-headline-md; }
        .Token\/Text\/BodyMd { @apply font-body-md text-body-md; }
        .Token\/Text\/LabelLg { @apply font-label-lg text-label-lg; }
        .Token\/Text\/LabelSm { @apply font-label-sm text-label-sm; }
        
        body {
          min-height: max(884px, 100dvh);

<body class="Token/Color/Background font-body-lg antialiased pb-[env(safe-area-inset-bottom,180px)] pt-[env(safe-area-inset-top,0px)] pb-[180px]">
<!-- Component/TopAppBar -->
<header class="Component/TopAppBar sticky top-[env(safe-area-inset-top,0px)] z-40 bg-background/90 backdrop-blur-md px-container_margin pt-lg pb-md flex flex-col gap-sm">
<div class="flex justify-between items-center h-[48px] min-h-[44px]">
<h1 class="Token/Text/TitleLg text-on-surface">库</h1>
<button class="w-[44px] h-[44px] min-w-[44px] min-h-[44px] flex items-center justify-end text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="filter_list" style="font-variation-settings: 'FILL' 0;">filter_list</span>
</button>
</div>
<!-- Search Bar -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="search">search</span>
</div>
<input class="block w-full pl-[44px] pr-md py-sm Token/Color/SurfaceContainerHigh border-none rounded-full placeholder:text-on-surface-variant focus:ring-1 focus:ring-primary focus:bg-surface-container Token/Text/BodyMd transition-colors min-h-[44px]" placeholder="搜索声音..." type="text"/>
</div>
<!-- Categories Segmented Control -->
<div class="flex overflow-x-auto gap-base pb-xs mt-sm no-scrollbar">
<button class="flex-shrink-0 px-md py-xs min-h-[44px] rounded-full Token/Color/SecondaryContainer Token/Text/LabelLg transition-colors">全部</button>
<button class="flex-shrink-0 px-md py-xs min-h-[44px] rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors Token/Text/LabelLg">助眠</button>
<button class="flex-shrink-0 px-md py-xs min-h-[44px] rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors Token/Text/LabelLg">自然</button>
<button class="flex-shrink-0 px-md py-xs min-h-[44px] rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors Token/Text/LabelLg">噪音</button>
<button class="flex-shrink-0 px-md py-xs min-h-[44px] rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors Token/Text/LabelLg">居家</button>
<button class="flex-shrink-0 px-md py-xs min-h-[44px] rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors Token/Text/LabelLg">专注</button>
<button class="flex-shrink-0 px-md py-xs min-h-[44px] rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors Token/Text/LabelLg">婴儿</button>
</div>
</header>
<!-- Main Content Grid -->
<main class="px-container_margin pt-md flex flex-col gap-xl">
<!-- Section: Sleep -->
<div class="flex flex-col gap-md">
<h2 class="Token/Text/TitleMd text-on-surface">热门助眠</h2>
<div class="grid grid-cols-2 md:grid-cols-4 gap-sm">
<!-- Component/SoundItem: Active -->
<div class="Component/SoundItem Token/Color/SurfaceContainer rounded-xl p-md flex flex-col items-center text-center gap-sm relative border border-primary/20">
<div class="absolute top-sm right-sm w-2 h-2 rounded-full bg-primary" title="In Mix"></div>
<div class="w-16 h-16 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[32px]" data-icon="thunderstorm">thunderstorm</span>
</div>
<span class="Token/Text/LabelLg text-primary">雷声</span>
<button class="w-full mt-xs py-xs min-h-[44px] rounded-lg border border-primary/30 text-primary Token/Text/LabelSm hover:bg-primary/10 transition-colors">移除</button>
</div>
<!-- Component/SoundItem -->
<div class="Component/SoundItem Token/Color/SurfaceContainer rounded-xl p-md flex flex-col items-center text-center gap-sm hover:bg-surface-container-high transition-colors group cursor-pointer border border-transparent hover:border-white/5">
<div class="w-16 h-16 rounded-full bg-surface-container-high group-hover:bg-surface-bright flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">

<div class="w-16 h-16 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[32px]" data-icon="forest">forest</span>
</div>

</div>
<!-- Component/SoundItem -->
<div class="Component/SoundItem Token/Color/SurfaceContainer rounded-xl p-md flex flex-col items-center text-center gap-sm hover:bg-surface-container-high transition-colors group cursor-pointer border border-transparent hover:border-white/5">
<div class="w-16 h-16 rounded-full bg-surface-container-high group-hover:bg-surface-bright flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">

</div>
</div>
</div>

</div>
<!-- Component/SoundItem -->

</div>
<!-- Section: Home -->

<div class="grid grid-cols-2 md:grid-cols-4 gap-sm">
<!-- Component/SoundItem -->
<div class="Component/SoundItem Token/Color/SurfaceContainer rounded-xl p-md flex flex-col items-center text-center gap-sm hover:bg-surface-container-high transition-colors group cursor-pointer border border-transparent hover:border-white/5">

</button>

</div>
<button class="w-[44px] h-[44px] min-w-[44px] min-h-[44px] flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors">

</div>
<!-- Component/BottomNav -->
<nav class="Component/BottomNav fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-md pb-[max(env(safe-area-inset-bottom,16px),16px)] pt-base Token/Color/SurfaceContainer">
<!-- Inactive Tab -->
