<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom scrollbar hide for horizontal lists */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="Token-Color-Background bg-background Token-Text-Body text-on-surface font-body-lg min-h-screen antialiased flex flex-col relative pb-[160px] pb-safe">
<!-- TopAppBar -->
<header class="Component-TopAppBar Token-Color-Background bg-background flex justify-between items-center px-container_margin h-touch_target_min min-h-touch w-full sticky top-0 z-40 pt-safe">
<button aria-label="Settings" class="min-w-touch min-h-touch flex items-center justify-start text-primary transition-colors duration-300 ease-in-out hover:bg-surface-container rounded-full">
<span class="material-symbols-outlined">settings</span>
</button>
<h1 class="Token-Text-Title font-headline-lg font-semibold text-primary">定时器</h1>
<button aria-label="User Profile" class="min-w-touch min-h-touch flex items-center justify-end text-primary transition-colors duration-300 ease-in-out hover:bg-surface-container rounded-full">
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant/30 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 20px;">person</span>
</div>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-container_margin pt-xl gap-xl">
<!-- Large Duration Display (Setup State) -->
<section class="flex flex-col items-center justify-center pt-lg pb-md">
<div class="flex items-center gap-xs font-display text-display text-primary">
<div class="flex flex-col items-center">
<span class="text-[64px] font-light leading-none tracking-tight">00</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-2">小时</span>
</div>
<span class="text-[64px] font-light leading-none pb-8 text-on-surface-variant/50">:</span>
<div class="flex flex-col items-center">
<span class="text-[64px] font-light leading-none tracking-tight text-on-surface">30</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-2">分钟</span>
</div>
</div>
<!-- Subtle swipe/scroll affordance hint -->
<div class="mt-md h-1 w-16 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full w-1/3 bg-primary rounded-full mx-auto"></div>
</div>
</section>
<!-- Presets -->
<section class="w-full">
<div class="flex overflow-x-auto no-scrollbar gap-sm pb-xs">
<button class="Component-TimerPresetChip Token-Color-Surface flex-none h-[44px] min-h-touch min-w-touch px-md rounded-full bg-surface-container border border-white/5 font-label-lg text-label-lg text-on-surface-variant whitespace-nowrap transition-colors hover:bg-surface-container-high">15分钟</button>
<button class="Component-TimerPresetChip Token-Color-Surface flex-none h-[44px] min-h-touch min-w-touch px-md rounded-full bg-secondary-container border border-primary/20 font-label-lg text-label-lg text-on-secondary-container whitespace-nowrap transition-colors">30分钟</button>
<button class="Component-TimerPresetChip Token-Color-Surface flex-none h-[44px] min-h-touch min-w-touch px-md rounded-full bg-surface-container border border-white/5 font-label-lg text-label-lg text-on-surface-variant whitespace-nowrap transition-colors hover:bg-surface-container-high">45分钟</button>
<button class="Component-TimerPresetChip Token-Color-Surface flex-none h-[44px] min-h-touch min-w-touch px-md rounded-full bg-surface-container border border-white/5 font-label-lg text-label-lg text-on-surface-variant whitespace-nowrap transition-colors hover:bg-surface-container-high">1小时</button>
<button class="Component-TimerPresetChip Token-Color-Surface flex-none h-[44px] min-h-touch min-w-touch px-md rounded-full bg-surface-container border border-white/5 font-label-lg text-label-lg text-on-surface-variant whitespace-nowrap transition-colors hover:bg-surface-container-high">2小时</button>
</div>
</section>
<!-- Settings Cards -->
<div class="flex flex-col gap-sm">
<!-- Fade-out Section -->
<div class="Token-Color-Surface bg-surface-container rounded-xl p-md flex flex-col gap-md border border-white/5">
<div class="Component-ToggleRow flex items-center justify-between min-h-touch">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant">volume_down</span>
<span class="Token-Text-Body font-body-lg text-body-lg text-on-surface">淡出音频</span>
</div>
<!-- Custom Toggle -->
<label class="relative inline-flex items-center cursor-pointer h-[44px] min-h-touch min-w-touch justify-end">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-1/2 after:-translate-y-1/2 after:left-[calc(100%-2.75rem+2px)] peer-checked:after:left-[calc(100%-2.75rem+2px)] after:bg-white after:border-white after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
<!-- Fade Duration Sub-selector -->
<div class="flex bg-surface rounded-lg p-1 border border-white/5 h-[44px] min-h-touch items-center">
<button class="flex-1 h-full min-h-touch rounded-md font-label-lg text-label-lg text-on-surface-variant transition-colors hover:bg-surface-container-highest">5m</button>
<button class="flex-1 h-full min-h-touch rounded-md bg-surface-container-high shadow-sm font-label-lg text-label-lg text-on-surface transition-colors">10m</button>
<button class="flex-1 h-full min-h-touch rounded-md font-label-lg text-label-lg text-on-surface-variant transition-colors hover:bg-surface-container-highest">15m</button>
</div>
</div>
<!-- Options Section -->
<div class="Token-Color-Surface bg-surface-container rounded-xl flex flex-col border border-white/5">
<label class="Component-ToggleRow flex items-center justify-between p-md h-touch_target_min min-h-touch cursor-pointer border-b border-white/5">
<div class="flex flex-col">
<span class="Token-Text-Body font-body-lg text-body-lg text-on-surface">停止播放</span>
<span class="Token-Text-Body font-body-md text-body-md text-on-surface-variant">当定时结束时</span>
</div>
<div class="w-6 h-6 min-w-[24px] rounded-full border-2 border-primary flex items-center justify-center bg-primary text-background">
<span class="material-symbols-outlined" style="font-size: 16px;">check</span>
</div>
</label>
<label class="Component-ToggleRow flex items-center justify-between p-md h-touch_target_min min-h-touch cursor-pointer">
<div class="flex flex-col">
<span class="Token-Text-Body font-body-lg text-body-lg text-on-surface">保持屏幕微弱亮度</span>
<span class="Token-Text-Body font-body-md text-body-md text-on-surface-variant">防止自动锁屏</span>
</div>
<div class="w-6 h-6 min-w-[24px] rounded-full border-2 border-outline-variant flex items-center justify-center">
</div>
</label>
</div>
</div>
<!-- CTA -->
<div class="pt-md pb-xl flex justify-center mt-auto">
<button class="Component-Button-Primary Token-Color-Surface w-full max-w-[280px] h-touch_target_min min-h-touch bg-primary text-on-primary font-headline-md text-headline-md rounded-full shadow-[0_0_20px_rgba(138,211,206,0.1)] transition-transform active:scale-95 flex items-center justify-center gap-sm">
<span class="material-symbols-outlined fill-icon">play_arrow</span>
                开始计时
            </button>
</div>
</main>
<!-- Mini Player (Persistent) -->
<div class="Component-MiniPlayer fixed bottom-[calc(88px+env(safe-area-inset-bottom))] left-0 w-full px-container_margin z-40">
<div class="Token-Color-Surface bg-surface-container-high rounded-xl h-[64px] w-full flex items-center justify-between px-md shadow-lg border border-white/5">
<div class="flex items-center gap-sm flex-1 min-w-0">
<div class="w-10 h-10 rounded-lg bg-surface-container border border-white/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" style="font-size: 20px;">water_drop</span>
</div>
<div class="flex flex-col truncate">
<span class="Token-Text-Body font-body-md text-body-md font-medium text-on-surface truncate">Deep Rain Cascade</span>
<span class="Token-Text-Body font-label-sm text-label-sm text-on-surface-variant truncate">Playing</span>
</div>
</div>
<div class="flex items-center gap-xs shrink-0">
<button class="w-touch_target_min h-touch_target_min min-h-touch min-w-touch flex items-center justify-center text-on-surface transition-opacity hover:opacity-80">
<span class="material-symbols-outlined fill-icon">pause</span>
</button>
</div>
</div>
</div>
<!-- BottomNavBar -->
<nav class="Component-BottomNav Token-Color-Surface fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-md pb-[calc(16px+env(safe-area-inset-bottom))] pt-base bg-surface-container border-t border-white/5">
<!-- Home: Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:opacity-80 scale-95 active:scale-90 transition-transform min-h-touch min-w-touch" href="#">
<span class="material-symbols-outlined mb-1">home</span>
<span class="Token-Text-Body font-label-sm text-label-sm">首页</span>
</a>
<!-- Mixer: Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:opacity-80 scale-95 active:scale-90 transition-transform min-h-touch min-w-touch" href="#">
<span class="material-symbols-outlined mb-1">tune</span>
<span class="Token-Text-Body font-label-sm text-label-sm">混音</span>
</a>
<!-- Timer: Active -->
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-sm py-xs hover:opacity-80 scale-95 active:scale-90 transition-transform min-h-touch min-w-[64px]" href="#">
<span class="material-symbols-outlined fill-icon mb-1">timer</span>
<span class="Token-Text-Body font-label-sm text-label-sm">定时</span>
</a>
<!-- Library: Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:opacity-80 scale-95 active:scale-90 transition-transform min-h-touch min-w-touch" href="#">
<span class="material-symbols-outlined mb-1">library_music</span>
<span class="Token-Text-Body font-label-sm text-label-sm">库</span>
</a>
</nav>
</body></html>
